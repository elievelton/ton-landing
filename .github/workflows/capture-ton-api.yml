name: Diagnosticar captura das taxas Ton

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-ton:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Capturar dados atuais da Ton
        run: npx tsx scripts/capture-ton-api.ts

      - name: Publicar captura para análise
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ton-api-capture
          path: ton-capture/
          if-no-files-found: warn
          retention-days: 3
